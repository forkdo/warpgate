name: Cargo Deny
permissions:
  contents: read

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Cargo.toml 首行使用 nightly-only 的 cargo-features = ["profile-rustflags"],
      # stable cargo 连 cargo metadata 都解析不了,必须按 rust-toolchain.toml 装 nightly
      - name: Rust toolchain (per rust-toolchain.toml)
        run: rustup toolchain install nightly-2026-07-09 --profile minimal

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.18.9

      - name: cargo-deny check
        run: |
          cargo deny --version
          cargo deny check
