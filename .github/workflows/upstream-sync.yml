name: Upstream Sync

# 每天调度一次,拉取上游 warp-tech/warpgate,按 tag 依次合并:
# 第一个 job 先做节流判断(schedule 触发时,距 main 最近一次上游合并提交
# 不足 72 小时则跳过本次;手动触发豁免节流)——GitHub scheduler 高负载会
# 延迟/丢弃事件,故用每日 cron + 内部节流代替低频 `*/3` cron,单次被丢弃
# 只损失 1 天空窗;随后以 fork 自己已打的最后一个 v* tag 为基准(如 v1.1.0),
# 找出上游发布 tag 中版本号严格大于基准的(如 v1.2.0、v1.3.0),按版本升序排列;
# 旧的(如 v0.9.0、v1.0.0)与基准同版本的均跳过;
# 第二个 job 串行(max-parallel: 1)逐个 tag 合并到 main,每个合并提交打同名 tag
# (fork 的 tag 语义 = 上游发布内容 + fork 自身修改,指向合并提交而非上游原始提交),
# 每合一个 tag 就 cargo check 验证并依次推送 main 与该 tag。
# 无冲突直接合并;有冲突调 pi-action(AI)解决(最多 3 轮);AI 或验证失败则
# 回滚该 tag 的合并,工作流置为失败,等待人工处理。
# 注意:GitHub 的 schedule 在无活动 60 天后会自动禁用本工作流,需手动重新启用。

on:
  schedule:
    - cron: "17 1 * * *" # 每天 01:17 UTC(北京时间 09:17,错开整点高峰);是否实际同步由 throttle 步骤按 72 小时节流决定
  workflow_dispatch: {} # 支持手动触发
permissions:
  contents: write
  id-token: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/warp-tech/warpgate.git
  UPSTREAM_BRANCH: main

jobs:
  # ---------- 第 1 步:计算待合并的上游 tag 列表 ----------
  tags:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.tags }}
      should_run: ${{ steps.throttle.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      # 72 小时节流:schedule 每天都会触发,但距最近一次上游合并提交
      # 不满 72h(259200s)时跳过本次同步,保持约每 3 天一次的实际节奏。
      # GitHub scheduler 会延迟/丢弃事件,低频 cron 一旦被丢就是 3天空窗,
      # 故改为每日调度 + 内部节流。手动触发豁免节流,便于人工立即补同步。
      - name: Throttle scheduled runs to one sync per 72h
        id: throttle
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch - throttle bypassed"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(git log -1 --grep='^chore: merge upstream/' --format=%ct main || true)
          NOW=$(date +%s)
          if [ -z "$LAST" ]; then
            echo "No upstream merge commit yet - will run"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ $((NOW - LAST)) -lt 259200 ]; then
            echo "Last sync $((NOW - LAST))s ago (<72h) - skipping"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Last sync $((NOW - LAST))s ago (>=72h) - will run"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch upstream main and tags
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"
          # 上游 tag 放入独立命名空间 refs/tags/upstream/v*,避免与 fork 自己的
          # 同名 tag(fork 语义下指向合并提交)冲突;--force 保证更新到上游最新
          git fetch upstream --force 'refs/tags/v*:refs/tags/upstream/v*'

      - name: List unmerged upstream tags
        id: list
        run: |
          set -euo pipefail
          # 基准 = fork 自己已打的最后一个 v* tag(如 v1.1.0)。
          # fork 的 tag 在 refs/tags/v* 命名空间,上游的在 refs/tags/upstream/v*,
          # glob 'v*' 不会匹配到 upstream/ 前缀的引用。
          BASE=$(git for-each-ref 'refs/tags/v*' --sort=-v:refname --format='%(refname:short)' | head -n1)
          echo "Base fork tag: ${BASE:-<none>}"
          TAGS=()
          for REF in $(git for-each-ref refs/tags/upstream --format='%(refname:short)' --sort=v:refname); do
            VER="${REF#upstream/}"
            # 只保留版本号严格大于基准的上游 tag(如基准 v1.1.0 时只取 v1.2.0、v1.3.0),
            # 旧的 v0.9.0、v1.0.0 以及与基准同版本的都跳过
            if [ -z "$BASE" ] || \
               { [ "$(printf '%s\n%s\n' "$BASE" "$VER" | sort -V | tail -n1)" = "$VER" ] && [ "$VER" != "$BASE" ]; }; then
              TAGS+=("$VER")
            fi
          done
          if [ "${#TAGS[@]}" -eq 0 ]; then
            JSON='[]'
          else
            JSON=$(printf '%s\n' "${TAGS[@]}" | jq -R . | jq -sc .)
          fi
          echo "Pending upstream tags: $JSON"
          echo "tags=$JSON" >> "$GITHUB_OUTPUT"

  # ---------- 第 2 步:串行逐 tag 合并 / 打 tag / 推送 ----------
  merge:
    needs: tags
    # 节流跳过(should_run=false)或无待合并 tag 时不执行任何合并/打 tag/推送
    if: needs.tags.outputs.should_run == 'true' && needs.tags.outputs.list != '[]'
    runs-on: ubuntu-latest
    # 三轮 AI 各有 2400s(40min)硬超时,极端串联 120min + fetch/merge/verify
    # 余量,故总超时须大于 90min,否则第三轮会被 job 超时截断
    timeout-minutes: 150
    strategy:
      max-parallel: 1 # 串行:每个 tag 依次合并,前一个推送完成后才处理下一个
      fail-fast: true # 某个 tag 失败即停止后续 tag,避免在坏结果上叠加
      matrix:
        tag: ${{ fromJSON(needs.tags.outputs.list) }}

    env:
      TAG: ${{ matrix.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # warpgate-web 的 #[derive(RustEmbed)] 要求 ../warpgate-web/dist 在编译期
      # 存在,而 dist 是 gitignored 构建产物。与 clippy.yml/check-schema 工作流
      # 相同约定:打桩空目录即可通过 cargo check(空 Assets 会在运行时查
      # manifest 失败,但不影响合并验证)
      - name: Stub web assets for RustEmbed
        run: mkdir -p warpgate-web/dist

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 仓库 rust-toolchain.toml pin 到 nightly-2026-07-09,且 .cargo/config.toml
      # 使用 -Zthreads 等 nightly-only 标志,必须在 AI 与验证步骤前装好工具链
      - name: Rust toolchain (nightly-2026-07-09, per rust-toolchain.toml)
        run: rustup toolchain install nightly-2026-07-09 --profile minimal

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"
          git fetch upstream --force 'refs/tags/v*:refs/tags/upstream/v*'
          echo "MERGING=$(git rev-parse --short "upstream/$TAG^{commit}")" >> "$GITHUB_ENV"

      - name: Merge upstream tag (fast-forward or clean merge)
        id: merge
        run: |
          set -euo pipefail
          # 记录合并前的本地 HEAD,失败时用于回退
          echo "BASE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          if git merge "upstream/$TAG" -m "chore: merge upstream/$TAG" --no-edit; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          elif git ls-files --unmerged | grep -q .; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
          else
            # merge 失败但没有冲突文件(如无法合并的历史),放弃
            git merge --abort || true
            echo "::error::Merge failed without conflicts - aborting"
            exit 1
          fi

      # ---------- 有冲突:交给 AI 解决 ----------

      # openrouter/free 是 OpenRouter 的路由入口,每轮从当前可用的 free 模型中
      # 选取,不依赖单一模型的可用性。路由可能随机到较弱的模型,故最多重试 3 轮:
      # 每轮结束后由 "Round N check" 验证;失败则回滚到冲突状态重试。
      # 三轮全败则中止合并,工作流置为失败,等待人工处理。

      - name: Round 1 - Resolve conflicts with AI
        id: ai1
        if: steps.merge.outputs.conflicts == 'true'
        uses: cv/pi-action@v1
        with:
          github_token: ${{ secrets.PAT }}
          output_mode: output
          timeout: "2400"
          provider: openrouter
          model: openrouter/free
          prompt: |
            You are resolving git merge conflicts in a Rust SSH gateway project.

            The repo is a fork of warp-tech/warpgate. `git merge upstream/$TAG` was run
            (merging upstream release tag $TAG) and stopped with conflicts. Your job:

            1. Run `git diff --name-only --diff-filter=U` to list conflicted files.
            2. For each file, read the conflict markers (<<<<<<< HEAD / ======= / >>>>>>>)
               and resolve them by combining BOTH sides' intent:
               - HEAD (ours) contains this fork's own changes (e.g. the SSH inactivity_timeout=0
                 fix that disables the inactivity timeout when it is set to 0).
               - upstream/$TAG (theirs) contains the upstream feature changes.
               The correct resolution usually keeps the fork's semantics while adopting the
               upstream structure. Never delete either side's feature. If truly unsure how to
               combine them, keep the upstream side (theirs).
            3. Run `cargo check -p <affected-crate>` (pick crates from the conflicted file
               paths) to verify the result compiles. Fix any compile errors you introduced.
               Do NOT run `cargo check -p warpgate-web` alone or try to "fix" its
               serde_json/alloc feature error - that error is an artifact of checking
               a single crate in this workspace (feature unification is off) and does
               not occur in the real workspace build. Never edit Cargo.toml [features]
               or dependency lists to silence it.
            4. After ALL conflicts are resolved and cargo check passes, run:
               `git add -A && git commit -m "chore: merge upstream/$TAG"`
               (This exact format is required: a commit-msg hook rejects messages that do
               not start with a conventional-commit type like "chore:".)
               Do NOT add any Co-Authored-By or Generated-with lines to the commit message.
            5. When done, reply with a short summary of each conflict and how you resolved it.

            Do NOT push. Do NOT run cargo test or full builds. Do NOT rewrite history.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Round 1 check
        id: check1
        if: steps.merge.outputs.conflicts == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          ! git ls-files --unmerged | grep -q .
          ! git grep -qE '^<<<<<<< |^>>>>>>> '
          [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -ge 3 ]

      - name: Round 1 failed - reset to conflicted state
        if: steps.merge.outputs.conflicts == 'true' && steps.check1.outcome == 'failure'
        run: |
          set -euo pipefail
          # 丢弃第 1 轮 AI 的错误/部分结果,回到合并前基点并重放冲突。
          # 不用临时分支:merge 冲突期间 HEAD 仍在 main,提交自然落在 main 上。
          # (旧的 conflict-base 舞步会让 git branch -D 因"删除当前分支"失败,
          # 后续 AI 提交全部落在临时分支上,push origin main 推空。)
          git reset -q --hard "$BASE_HEAD"
          git merge "upstream/$TAG" -m "chore: merge upstream/$TAG" --no-edit || true
          echo "::warning::Round 1 failed, retrying with a fresh model pick"

      - name: Round 2 - Resolve conflicts with AI
        id: ai2
        if: steps.merge.outputs.conflicts == 'true' && steps.check1.outcome == 'failure'
        uses: cv/pi-action@v1
        with:
          github_token: ${{ secrets.PAT }}
          output_mode: output
          timeout: "2400"
          provider: openrouter
          model: openrouter/free
          prompt: |
            You are resolving git merge conflicts in a Rust SSH gateway project.

            The repo is a fork of warp-tech/warpgate. `git merge upstream/$TAG` was run
            (merging upstream release tag $TAG) and stopped with conflicts. Your job:

            1. Run `git diff --name-only --diff-filter=U` to list conflicted files.
            2. For each file, read the conflict markers (<<<<<<< HEAD / ======= / >>>>>>>)
               and resolve them by combining BOTH sides' intent:
               - HEAD (ours) contains this fork's own changes (e.g. the SSH inactivity_timeout=0
                 fix that disables the inactivity timeout when it is set to 0).
               - upstream/$TAG (theirs) contains the upstream feature changes.
               The correct resolution usually keeps the fork's semantics while adopting the
               upstream structure. Never delete either side's feature. If truly unsure how to
               combine them, keep the upstream side (theirs).
            3. Run `cargo check -p <affected-crate>` (pick crates from the conflicted file
               paths) to verify the result compiles. Fix any compile errors you introduced.
               Do NOT run `cargo check -p warpgate-web` alone or try to "fix" its
               serde_json/alloc feature error - that error is an artifact of checking
               a single crate in this workspace (feature unification is off) and does
               not occur in the real workspace build. Never edit Cargo.toml [features]
               or dependency lists to silence it.
            4. After ALL conflicts are resolved and cargo check passes, run:
               `git add -A && git commit -m "chore: merge upstream/$TAG"`
               (This exact format is required: a commit-msg hook rejects messages that do
               not start with a conventional-commit type like "chore:".)
               Do NOT add any Co-Authored-By or Generated-with lines to the commit message.
            5. When done, reply with a short summary of each conflict and how you resolved it.

            Do NOT push. Do NOT run cargo test or full builds. Do NOT rewrite history.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Round 2 check
        id: check2
        if: steps.merge.outputs.conflicts == 'true' && steps.check1.outcome == 'failure'
        continue-on-error: true
        run: |
          set -euo pipefail
          ! git ls-files --unmerged | grep -q .
          ! git grep -qE '^<<<<<<< |^>>>>>>> '
          [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -ge 3 ]

      # 第 2 轮失败:回滚到冲突状态(同 Round 1 reset,不用临时分支)
      - name: Round 2 failed - reset to conflicted state
        if: steps.merge.outputs.conflicts == 'true' && steps.check2.outcome == 'failure'
        run: |
          set -euo pipefail
          git reset -q --hard "$BASE_HEAD"
          git merge "upstream/$TAG" -m "chore: merge upstream/$TAG" --no-edit || true
          echo "::warning::Round 2 failed, one more retry"

      - name: Round 3 - Resolve conflicts with AI
        id: ai3
        if: steps.merge.outputs.conflicts == 'true' && steps.check2.outcome == 'failure'
        uses: cv/pi-action@v1
        with:
          github_token: ${{ secrets.PAT }}
          output_mode: output
          timeout: "2400"
          provider: openrouter
          model: openrouter/free
          prompt: |
            You are resolving git merge conflicts in a Rust SSH gateway project.

            The repo is a fork of warp-tech/warpgate. `git merge upstream/$TAG` was run
            (merging upstream release tag $TAG) and stopped with conflicts. Your job:

            1. Run `git diff --name-only --diff-filter=U` to list conflicted files.
            2. For each file, read the conflict markers (<<<<<<< HEAD / ======= / >>>>>>>)
               and resolve them by combining BOTH sides' intent:
               - HEAD (ours) contains this fork's own changes (e.g. the SSH inactivity_timeout=0
                 fix that disables the inactivity timeout when it is set to 0).
               - upstream/$TAG (theirs) contains the upstream feature changes.
               The correct resolution usually keeps the fork's semantics while adopting the
               upstream structure. Never delete either side's feature. If truly unsure how to
               combine them, keep the upstream side (theirs).
            3. Run `cargo check -p <affected-crate>` (pick crates from the conflicted file
               paths) to verify the result compiles. Fix any compile errors you introduced.
               Do NOT run `cargo check -p warpgate-web` alone or try to "fix" its
               serde_json/alloc feature error - that error is an artifact of checking
               a single crate in this workspace (feature unification is off) and does
               not occur in the real workspace build. Never edit Cargo.toml [features]
               or dependency lists to silence it.
            4. After ALL conflicts are resolved and cargo check passes, run:
               `git add -A && git commit -m "chore: merge upstream/$TAG"`
               (This exact format is required: a commit-msg hook rejects messages that do
               not start with a conventional-commit type like "chore:".)
               Do NOT add any Co-Authored-By or Generated-with lines to the commit message.
            5. When done, reply with a short summary of each conflict and how you resolved it.

            Do NOT push. Do NOT run cargo test or full builds. Do NOT rewrite history.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # 三轮全败:中止合并,工作流失败
      - name: Final check - all rounds exhausted
        if: steps.merge.outputs.conflicts == 'true' && steps.check2.outcome == 'failure'
        run: |
          set -euo pipefail
          ! git ls-files --unmerged | grep -q .
          ! git grep -qE '^<<<<<<< |^>>>>>>> '
          [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -ge 3 ]
          echo "AI resolution verified"

      # ---------- 验证合并结果 ----------

      - name: Verify merged code compiles
        if: steps.merge.outputs.merged == 'true' || steps.merge.outputs.conflicts == 'true'
        run: |
          set -euo pipefail
          # 对整个合并结果统一验证(工具链已由 rustup 按 rust-toolchain.toml 选择)
          if ! cargo check --workspace 2>&1; then
            echo "::error::cargo check failed on merged result - aborting"
            git merge --abort 2>/dev/null || git reset --hard "$BASE_HEAD"
            exit 1
          fi

      - name: Push merged main
        if: steps.merge.outputs.merged == 'true' || steps.merge.outputs.conflicts == 'true'
        run: |
          set -euo pipefail
          # 成功合并的提交必须落在 main 上:冲突解决轮次可能把 HEAD 留在
          # 临时分支(原 conflict-base 舞步会因"删除当前分支"失败而静默
          # 留在临时分支),此时 push origin main 会推空或非快进失败。
          git rev-parse --verify -q main > /dev/null
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse main)" ]; then
            echo "::error::HEAD is not on main (on $(git branch --show-current)) - refusing to push"
            exit 1
          fi
          # 合并可能含 .github/workflows/ 变更,GITHUB_TOKEN 无 workflow 写入权限,需 PAT 推送。
          # checkout 用 persist-credentials:false 避免 GITHUB_TOKEN 的 extraheader 污染,
          # 此处直接用 PAT 重写 origin URL 推送即可。
          git remote set-url origin "https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git"
          git push origin main
          echo "Pushed main $(git rev-parse --short HEAD) (merged upstream tag $TAG at $(git rev-parse --short "$MERGING"))"

      - name: Tag merged main with this upstream release
        if: steps.merge.outputs.merged == 'true' || steps.merge.outputs.conflicts == 'true'
        run: |
          set -euo pipefail
          # fork 的 tag 语义 = 上游发布内容 + fork 自身修改,即 $TAG 指向本次
          # 合并提交,而非上游原始发布提交。CI 无 GPG 私钥,故为附注标签(无签名)。
          # 先确认该上游发布提交确实随本次合并进入了 main。
          git merge-base --is-ancestor "upstream/$TAG" main
          git tag -a "$TAG" -m "$TAG" main
          git remote set-url origin "https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git"
          git push origin "refs/tags/$TAG"
          echo "Tagged merge commit $(git rev-parse --short main) as $TAG (upstream release $MERGING)"
